version: "3.9"

services:
  masterplan_db:
    container_name: "masterplan_db"
    image: postgres:17
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: masterplan_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d masterplan_db" ]
      interval: 10s
      timeout: 5s
      retries: 15
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./masterplan_db_script.sql:/docker-entrypoint-initdb.d/masterplan_db_script.sql
      - datastore:/app/datastore

  masterplan:
    container_name: "masterplan"
    build:
      dockerfile: ./Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: MasterPlanApi
      SPRING_DATASOURCE_URL: jdbc:postgresql://masterplan_db:5432/masterplan_db
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DOC_API_DOCS_ENABLED: "true"
      SPRING_DOC_SWAGGER_UI_ENABLED: "true"
      SPRING_DOC_API_DOCS_PATH: /api/v1/api-docs
      JWT_SECRET: ${MASTERPLAN_JWT_SECRET}
      JWT_EXPIRATION: 12
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB_SOCKET: TRACE
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_MESSAGING: TRACE
      LOGGING_LEVEL_API_MASTERPLAN_APP: DEBUG
      STORAGE_PATH: ${MASTERPLAN_FILES_STORAGE}
      STORAGE_ENCRYPT_KEY: ${MASTERPLAN_FILES_STORAGE_ENCRYPT_KEY}
      SPRING_SERVLET_MULTIPART_ENABLED: "true"
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 25MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 25MB
      SPRING_SERVLET_MULTIPART_RESOLVE_LAZILY: "true"
    labels:
      logging: "promtail"
    depends_on:
      masterplan_db:
        condition: service_healthy


  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - loki
      - promtail



  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki



volumes:
  db_data:
  datastore:
  grafana_data:
