name: Deploy Swagger Docs to GitHub Pages

on:
  push:
    branches: [ dev/create-github-pages-with-docs ]
  pull_request:
    branches: [ dev/create-github-pages-with-docs ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
          DATABASE_USER=${{ secrets.DATABASE_USER }}
          EOF


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start services with Docker Compose
        run: |
          docker compose up -d --build
          sleep 60  # ждём старта приложения

      - name: Wait for application readiness
        run: |
          for i in {1..30}; do
            if curl -f http://masterplan:8080/api/v1/api-docs 2>/dev/null; then
              echo "Application is ready"
              break
            fi
            echo "Waiting for application... attempt $i/30"
            sleep 10
          done

      - name: Export Swagger JSON
        run: |
          curl -o swagger.json http://masterplan:8080/api/v1/api-docs

      - name: Generate HTML documentation
        run: |
          mkdir -p docs
          npx swagger-ui-dist@latest -o docs --json swagger.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: docs
          force_orphan: true
          commit_message: 'Update Swagger documentation'


      - name: Clean up
        if: always()
        run: docker compose down
