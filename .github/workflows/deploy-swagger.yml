name: Deploy Swagger Docs to GitHub Pages

on:
  push:
    branches: [ dev/create-github-pages-with-docs ]
  pull_request:
    branches: [ dev/create-github-pages-with-docs ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create relative storage directory
        run: |
          mkdir -p ./files-storage
          echo "Created: $(pwd)/files-storage"

      - name: Create .env for CI/CD
        run: |
          cat > .env << EOF
          DATABASE_USER=${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
          MASTERPLAN_JWT_SECRET=${{ secrets.MASTERPLAN_JWT_SECRET }}
          MASTERPLAN_FILES_STORAGE=./files-storage
          MASTERPLAN_FILES_STORAGE_ENCRYPT_KEY=${{ secrets.MASTERPLAN_FILES_STORAGE_ENCRYPT_KEY }}
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start services with Docker Compose
        run: |
          docker compose up -d --build
          sleep 60

      - name: Check service logs
        run: docker compose logs

      - name: Wait for service to be ready and export Swagger JSON
        run: |
          max_attempts=30
          attempt=0
          until curl -f http://localhost:8080/api/v1/api-docs || [ $attempt -eq $max_attempts ]; do
            echo "Service not ready, waiting 10 seconds (attempt $((attempt + 1))/$max_attempts)..."
            sleep 10
            attempt=$((attempt + 1))
          done
          if [ $attempt -eq $max_attempts ]; then
            echo "Error: Service did not become ready in time"
            exit 1
          fi
          curl -o swagger.json http://localhost:8080/api/v1/api-docs

      - name: Generate HTML documentation
        run: |
          mkdir -p docs
          npx swagger-ui-dist@latest -o docs --json swagger.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: docs
          force_orphan: true
          commit_message: 'Update Swagger documentation'


      - name: Clean up
        if: always()
        run: docker compose down
